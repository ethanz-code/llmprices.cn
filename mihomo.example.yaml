# mihomo 采集兜底出口配置模板：复制为 mihomo/config.yaml 并填入订阅链接。
#   mkdir -p mihomo && cp mihomo.example.yaml mihomo/config.yaml
#   填 url 后：chmod 600 mihomo/config.yaml
# 订阅链接自带 token，本文件不要提交进仓库（mihomo/ 已在 .gitignore）。
mixed-port: 7890
# 必须开：默认只监听 127.0.0.1，api/web 容器从容器网络连不进来；
# 端口没有发布到宿主机，容器网络外依然不可达
allow-lan: true
mode: rule
log-level: warning

# 控制接口：采集被目标站拒绝时自动换节点要用到（面板「采集出口」填 http://proxy:9090）。
# mihomo 默认不开这个口，不写这一行自动换节点永远连不上；必须绑 0.0.0.0——写 127.0.0.1
# 只监听容器自己，api 容器连不进来；端口不发布到宿主机，容器网络外摸不到，公网无风险。
external-controller: 0.0.0.0:9090
# 换成自己的随机串（openssl rand -hex 16），与面板里填的密钥保持一致；留空 = 不校验
secret: "在这里填入随机密钥"

# 订阅自动更新：每 12 小时拉一次；health-check 剔除坏节点。
# V2Board 系机场在链接末尾加 &flag=clash（已有 ? 用 &，没有 ? 用 ?）返回 Clash 格式；
# 启动日志报 providers 解析失败时，换用机场提供的「Clash 订阅」地址。
proxy-providers:
  airport:
    type: http
    url: "在这里填入订阅链接"
    interval: 43200
    path: ./providers/airport.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600

# 自动挑当前延迟最低的可用节点，节点挂了自动切；面板「节点组名」填 PROXY
# （自动切换只是在组内换一个对该目标站实测可达的节点，不动订阅本身）
proxy-groups:
  - name: PROXY
    type: url-test
    use: [airport]
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 100

rules:
  - MATCH,PROXY
